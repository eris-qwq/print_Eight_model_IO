# OpenOCD configuration for MSPM0G3507 with an external SEGGER J-Link.
# Default: program, verify, reset/run, then exit.
# Debug server only: openocd -c "set FLASH_ON_START 0" -f openocd.cfg

if { ![info exists FLASH_ON_START] } {
    set FLASH_ON_START 1
}

set _PROJECT_DIR [file dirname [file normalize [info script]]]
set _FIRMWARE [file join $_PROJECT_DIR build Debug print_Eight_model_IO.elf]

if { $FLASH_ON_START && ![file exists $_FIRMWARE] } {
    error "Firmware not found: $_FIRMWARE. Run cmake --build --preset Debug first."
}

source [find interface/jlink.cfg]

# Match the existing J-Link setup: SWD at 4 MHz.
transport select swd
adapter speed 4000

# MSPM0G3507 SRAM is mapped at 0x20200000 in this project's linker script.
set CHIPNAME mspm0g3507
set WORKAREABASE 0x20200000
set WORKAREASIZE 0x1000

# Requires an OpenOCD build that includes the MSPM0 flash driver.
source [find target/ti/mspm0.cfg]

if { $FLASH_ON_START } {
    echo "Programming firmware: $_FIRMWARE"
    program $_FIRMWARE verify reset exit
}
